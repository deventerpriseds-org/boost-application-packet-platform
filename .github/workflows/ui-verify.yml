name: UI Verify (Playwright)

# Headless-browser verification of the LIVE Executive Engine SPA. Runs on a GitHub runner (open
# internet + can execute the React bundle), impersonates a real owner via localStorage, opens a hash
# route, asserts required text is rendered, and uploads a full-page screenshot. This is how the agent
# confirms UI changes it cannot see from the sandbox (which is blocked from *.azurestaticapps.net).
on:
  workflow_dispatch:
    inputs:
      route:
        description: 'Hash route to open (e.g. #/settings/roles)'
        required: false
        default: '#/settings/roles'
      owner:
        description: 'Owner email to impersonate'
        required: false
        default: 'von.ellis@enterpriseds.io'
      expect:
        description: "';'-separated substrings that must ALL appear"
        required: false
        default: 'Target roles;VP, Product;Dir, Product;Chief AI Officer'
      count_sel:
        description: 'Optional CSS selector to count'
        required: false
        default: ''
      count_min:
        description: 'Optional minimum count for count_sel'
        required: false
        default: '0'
      count_max:
        description: 'Optional maximum count for count_sel (0 asserts the element is absent)'
        required: false
        default: ''
      expect_absent:
        description: "';'-separated substrings that must NOT appear (proves a stale/duplicate surface is gone)"
        required: false
        default: ''
      click_sel:
        description: 'Optional CSS selector to click before asserting (reaches surfaces behind an interaction)'
        required: false
        default: ''
      measure_sel:
        description: 'Optional CSS selector to measure (reports width/height/visible)'
        required: false
        default: ''
      viewport_w:
        description: 'Viewport width (assert responsive breakpoints)'
        required: false
        default: '1440'
      viewport_h:
        description: 'Viewport height'
        required: false
        default: '1700'
      app_url:
        description: 'SPA base URL'
        required: false
        default: 'https://purple-ground-0f377120f.7.azurestaticapps.net'

# `contents: write` is required by the ui-shots push below; the default token is read-only.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@latest
          npx playwright install --with-deps chromium
      - name: Run UI verification
        env:
          APP_URL: ${{ inputs.app_url }}
          ROUTE: ${{ inputs.route }}
          OWNER: ${{ inputs.owner }}
          EXPECT: ${{ inputs.expect }}
          COUNT_SEL: ${{ inputs.count_sel }}
          COUNT_MIN: ${{ inputs.count_min }}
          COUNT_MAX: ${{ inputs.count_max }}
          EXPECT_ABSENT: ${{ inputs.expect_absent }}
          CLICK_SEL: ${{ inputs.click_sel }}
          MEASURE_SEL: ${{ inputs.measure_sel }}
          VIEWPORT_W: ${{ inputs.viewport_w }}
          VIEWPORT_H: ${{ inputs.viewport_h }}
          OUT: ui-verify.png
        run: node scripts/ui-verify.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verify-screenshot
          path: ui-verify.png
          if-no-files-found: warn

      # Push the PNG to an orphan `ui-shots` branch so a Claude Code session can actually LOOK at it.
      #
      # WHY THIS EXISTS: the sandbox cannot download a workflow artifact. Both routes are blocked by
      # the egress proxy with a 403 CONNECT - github.com/.../artifacts/<id> (redirects to blob
      # storage) and api.github.com/.../artifacts/<id>/zip (even with a valid Bearer token). git,
      # however, IS allowed. So the screenshot travels by the one transport that works.
      #
      # Without this, a session verifying the live UI can only read TEXT assertions out of the job
      # log - body length, a substring match, an element count - and then infer what the page looks
      # like. That inference is exactly how this session spent several rounds reasoning about
      # screenshot file SIZES instead of comparing two rendered pages. The owner's words: "wait
      # using a kb test is crazy.... why aren't you actually rendering both the live app and the
      # prototype to compare?"
      #
      # Orphan branch, single commit, force-pushed: this is a scratch surface for the newest shot,
      # never history. It must never be merged anywhere.
      - name: Publish screenshot to the ui-shots branch
        if: always()
        env:
          ROUTE: ${{ inputs.route }}
        run: |
          test -f ui-verify.png || exit 0
          SAFE=$(printf '%s' "$ROUTE" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')
          mkdir -p /tmp/shots && cp ui-verify.png "/tmp/shots/${SAFE:-shot}.png"
          cp ui-verify.png /tmp/shots/latest.png
          cd /tmp/shots
          git init -q .
          git config user.email "actions@github.com"
          git config user.name "ui-verify"
          git checkout -q --orphan ui-shots
          git add -A
          git commit -q -m "ui-verify ${ROUTE} @ ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            ui-shots
          echo "screenshot pushed to branch ui-shots as ${SAFE:-shot}.png and latest.png"
