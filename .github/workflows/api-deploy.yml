name: Deploy API to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: |
          cd api
          npm ci

      - name: Build TypeScript
        run: |
          cd api
          # STAMP THE COMMIT INTO THE SOURCE BEFORE COMPILING, so the sha travels inside the bundle.
          # The convergence poll below waits for this value; reading it from the app setting instead
          # made the poll pass while the OLD bundle was serving, twice (see buildStamp.ts).
          python3 - <<'STAMP'
          import pathlib, re
          p = pathlib.Path('src/functions/buildStamp.ts')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r"export const BUILD_SHA: string \| null = null",
                      "export const BUILD_SHA: string | null = '${{ github.sha }}'", s, count=1)
          # A silent no-op here would restore the exact defect this replaces, so assert the edit.
          assert s2 != s, 'BUILD_SHA placeholder not found -- the stamp did not apply'
          p.write_text(s2, encoding='utf-8')
          print('stamped BUILD_SHA=${{ github.sha }}')
          STAMP
          grep -n "BUILD_SHA: string" src/functions/buildStamp.ts
          npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create deployment zip
        run: |
          cd api
          zip -r ../api-deploy.zip . --exclude '*.ts' --exclude 'src/*'

      # MASTERCONTEXT_SOURCE=postgres is set here, with the other app settings, so the store the
      # owner's master profile is read from is DECLARED IN THE REPO rather than living only as a
      # hand-set value in the Azure portal that nobody can review or diff.
      #
      # Owner-instructed 2026-09-03: *"storage will just be a backup once copy to postgres is done"*.
      # The copy has run (14 blocks, confirmed by pg-migrate's own row count and by a direct DB read),
      # and the independent verifier confirmed masterBaseline parity, so this is the cut-over.
      #
      # ROLLBACK IS THIS ONE WORD. Change `postgres` to `storage` and redeploy; both code paths are
      # live and neither is dead code (H:mastercontext-rollback-flag proves both branches reachable).
      # NOTHING was deleted from Azure Storage -- the seed row and every raw-read code path are still
      # there, which is what makes the rollback real rather than aspirational.
      - name: Sync secrets to Function App settings
        run: |
          az functionapp config appsettings set \
            --name job-platform-api \
            --resource-group EnterpriseDS_ResourceGRP \
            --settings \
              "DEPLOYED_SHA=${{ github.sha }}" \
              "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
              "MICROSOFT_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" \
              "MICROSOFT_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" \
              "SESSION_SIGNING_SECRET=${{ secrets.SESSION_SIGNING_SECRET }}" \
              "MICROSOFT_TENANT_ID=ee633423-c321-413c-a191-ace8b07e4196" \
              "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" \
              "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" \
              "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" \
              "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "AZURE_PG_HOST=eds-postgresql.postgres.database.azure.com" \
              "AZURE_PG_PORT=5432" \
              "AZURE_PG_DATABASE=boost_resume_n_packet_builder" \
              "AZURE_PG_USER=Admin_eds" \
              "AZURE_PG_PASSWORD=${{ secrets.Azure_admin_pw }}" \
              "HEYGEN_API_KEY=${{ secrets.HEYGEN_API_KEY }}" \
              "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" \
              "ELEVENLABS_DEFAULT_VOICE_ID=${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}" \
              "ELEVENLABS_AGENT_ID=agent_1901kx3w6qd0f1yrr74gevbyhj1k" \
              "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" \
              "UAT_BYPASS_TOKEN=${{ secrets.UAT_BYPASS_TOKEN }}" \
              "HEYGEN_CLONE_1_AVATAR_IDENTITY_ID=${{ secrets.HEYGEN_CLONE_1_AVATAR_IDENTITY_ID }}" \
              "HEYGEN_CLONED_VOICE_ID=${{ secrets.HEYGEN_CLONED_VOICE_ID }}" \
              "SCRAPER_API_PROVIDER=${{ secrets.SCRAPER_API_PROVIDER }}" \
              "SCRAPER_API_KEY=${{ secrets.SCRAPER_API_KEY }}" \
              "SCRAPE_DO_API_KEY=${{ secrets.scrape_do_api_key }}" \
              "FIRECRAWL_API_KEY=${{ secrets.firecrawl_scraper_api_key }}" \
              "NODE_ENV=production" \
              "MASTERCONTEXT_SOURCE=postgres"

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name job-platform-api \
            --resource-group EnterpriseDS_ResourceGRP \
            --src api-deploy.zip

      - name: Set Function App settings
        run: |
          az functionapp config appsettings set \
            --name job-platform-api \
            --resource-group EnterpriseDS_ResourceGRP \
            --settings \
              GOOGLE_SERVICE_ACCOUNT_JSON='${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' \
              ZAPIER_DOCS_FOLDER_ID='1MlVLMSQ0EQJoAtpKC1Mv7mDCAJDmdJTt'

      # A table registered in SCHEMA_SQL is not thereby IN production. `comparison_dimension` was
      # registered in all three places — that is what ledger row D21 closed — and still did not exist
      # in the live database: db-query.yml run 32451433317 failed with
      #   ERROR:  relation "comparison_dimension" does not exist
      # A manual POST /api/diag/pg-migrate (run 32451553273) created it, after which P8.4 immediately
      # produced 8 rows on real data. Nothing ran the migration, so every schema change since the last
      # manual run sat dormant behind a green deploy.
      #
      # `ok` IS THE VERDICT, NOT THE STATUS CODE. pgMigrate's catch returns HTTP 200 with
      # {ok:false, error} (pgMigrate.ts:48) — the identical shape that let a fully failed pipeline run
      # report success until D12 fixed the caller. Reading only the status here would rebuild that
      # defect one workflow over.
      - name: Apply the database schema, and fail loudly if it did not apply
        run: |
          set -uo pipefail
          API=https://job-platform-api.azurewebsites.net

          # A new deploy restarts the worker and the route 404s until it converges. Poll for
          # readiness rather than guessing a sleep length.
          #
          # POLL FOR THE SHA, NOT FOR A 200. A 200 proves SOMETHING is serving, not that THIS build
          # is -- the old worker answers 200 just as happily. On 2026-08-28 this poll cleared in ~85s
          # against a ~90-120s convergence, so the pg-migrate below ran the PREVIOUS bundle's
          # SCHEMA_SQL, answered `ok:true, "Schema applied... 31/31 tables present"`, and the JD
          # column rename had not happened. Green deploy, old schema, no error anywhere. The only
          # thing that distinguishes the two workers is which commit they are running, so that is
          # what we wait for.
          #
          # WHAT IS POLLED CHANGED 2026-09-03, and the old wording is kept below because it is the
          # trap. This used to say "`DEPLOYED_SHA` is set in the app settings above and returned by
          # /api/health" -- and that was the defect, not the design. An app setting written by a
          # step ABOVE the code deploy flips before the code does, so the poll cleared on attempt 1
          # while the OLD bundle served, and pg-migrate ran the old SCHEMA_SQL. Measured twice:
          # 2026-08-28 at "31/31 tables present" (the JD rename never happened) and 2026-09-03 at
          # "32/32" -- that second one is proof rather than a symptom, because the deploy's SOURCE
          # had a 33-entry EXPECTED_TABLES and the RUNNING code still said 32.
          #
          # /api/health now reports `BUILD_SHA`, stamped into src/functions/buildStamp.ts in the
          # Build step ABOVE and compiled into dist/, so it ships INSIDE the zip and cannot change
          # until the new bundle is serving. `DEPLOYED_SHA` survives only as a fallback for an
          # unstamped build. Guarded by H:deploy-sha-comes-from-the-bundle.
          # BUDGET: 90 x 6s = 9 minutes. The first version allowed 40 x 6s = 4 minutes and FAILED the
          # deploy of d02e300 -- `health reports '<none>'` on all 40 attempts. Two causes, both mine:
          # `DEPLOYED_SHA` was being set in the POST-deploy settings step, and setting app settings
          # RESTARTS the Function App, so the convergence clock started over after the zip deploy had
          # already finished. It is now set BEFORE the deploy, making the code deploy the last
          # restart. The budget is widened anyway because 90-120s is the documented typical case, not
          # a ceiling, and the cost of waiting is a slower deploy while the cost of giving up too
          # early is a red deploy on a correct change.
          WANT="${{ github.sha }}"
          converged=""
          for i in $(seq 1 90); do
            got=$(curl -s --max-time 10 "$API/api/health" | python3 -c "import json,sys; print((json.load(sys.stdin).get('deployedSha') or ''))" 2>/dev/null || true)
            if [ "$got" = "$WANT" ]; then converged=yes; echo "worker is serving $WANT after $i attempt(s)"; break; fi
            echo "waiting for $WANT to serve (health reports '${got:-<none>}'), attempt $i"
            sleep 6
          done
          if [ -z "$converged" ]; then
            echo "FAILED: the worker never reported deployedSha=$WANT. Refusing to migrate, because"
            echo "pg-migrate would run whichever bundle IS serving and report success for it."
            exit 1
          fi

          body=$(curl -sS -X POST "$API/api/diag/pg-migrate")
          echo "$body" | head -c 4000
          echo
          MIGRATE_BODY="$body" python3 <<'PY'
          import json, os, sys
          try:
              r = json.loads(os.environ['MIGRATE_BODY'])
          except Exception as e:
              print(f'FAILED: migrate response was not JSON ({e})')
              sys.exit(1)
          # `[]` and `null` are valid JSON. Without this the next line raises AttributeError and the
          # step still fails — the safe direction — but it fails with a traceback instead of saying
          # what was wrong, which is the difference between a diagnosis and a puzzle at 3am.
          if not isinstance(r, dict):
              print(f'FAILED: migrate response was not a JSON object, got {type(r).__name__}')
              sys.exit(1)
          if r.get('ok') is not True:
              print(f"FAILED: schema did not apply - {r.get('error') or r.get('detail') or '(no detail)'}")
              sys.exit(1)
          print(f"schema applied: {r.get('detail')}")
          PY
