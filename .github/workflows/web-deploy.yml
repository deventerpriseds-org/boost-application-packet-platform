name: Deploy Web to Azure Static Web Apps

# LEGACY dev console (`web/`) -> Static Web App `job-platform-web`. NOT the product.
#
# NOTHING IS LIVE FROM ANY BRANCH EXCEPT `main`. Every deploy workflow in this repo
# fires on `main` only; pushing a branch (or opening a PR) deploys nothing anywhere.
# If you need a change live, land it on `main`.
#
# The `pull_request` trigger was REMOVED 2026-08-16: it ran on every PR regardless of
# paths and failed each one, because the `job-platform-web` SWA no longer exists in
# Azure (ResourceNotFound). It also provisioned per-PR staging environments on a live
# resource, which is what exhausted Azure's staging-environment cap. Restoring it
# requires recreating that SWA first — otherwise it only re-reds every PR.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and Build
        run: |
          cd web
          npm ci
          npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Get Static Web App token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name job-platform-web \
            --resource-group EnterpriseDS_ResourceGRP \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist
          output_location: ""
          skip_app_build: true
