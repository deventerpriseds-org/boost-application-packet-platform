name: Fixture Refresh

# Pull a full UI-comparison fixture set out of the production DB and COMMIT it to an orphan
# branch, so a CCR session can `git fetch` it.
#
# WHY A BRANCH AND NOT THE JOB LOG. The sandbox cannot download GH artifacts (403) and cannot
# reach the DB or the API directly. `git` is the only readable transport out of a runner, and
# this is the same trick `ui-verify.yml` uses to get screenshots back (the `ui-shots` branch).
# Reading a large JSON blob out of `get_job_logs` instead means hand-transcribing it, which
# risks a transcription error in the very data a measurement is judged against.
#
# WHY IT EXISTS AT ALL. The route-keyed fixture file used to live only in a session scratchpad.
# A container restore took it, and the next UI-gap measurement reported 193/26 against a
# recorded 146/15 - a 47-row "regression" that was entirely the harness, with nothing logging
# an error. See docs/qc-evidence/UI-GAP-REGISTER.md and scripts/build-fixtures.mjs.
#
# READ IT BACK FROM A SESSION:
#   git fetch origin '+refs/heads/ui-fixtures:refs/remotes/origin/ui-fixtures'
#   git show origin/ui-fixtures:raw-dump.json > /tmp/raw.json
#   node scripts/build-fixtures.mjs --raw /tmp/raw.json --opp <oppId> --out /tmp/fx.json

on:
  workflow_dispatch:
    inputs:
      opp:
        description: 'Opportunity id'
        required: true
        default: '2cb56fb3-fc33-4b1a-85b9-06c7aea2fbb3'
      packet:
        description: 'Packet id'
        required: true
        default: '4860ae3b-fa3a-46d0-9cfc-e656ae6835a5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump the fixture data
        env:
          PGHOST: eds-postgresql.postgres.database.azure.com
          PGPORT: 5432
          PGDATABASE: boost_resume_n_packet_builder
          PGUSER: Admin_eds
          PGPASSWORD: ${{ secrets.Azure_admin_pw }}
          PGSSLMODE: require
          OPP: ${{ github.event.inputs.opp }}
          PKT: ${{ github.event.inputs.packet }}
        run: |
          set -euo pipefail
          # -t -A -X: tuples only, unaligned, no .psqlrc - so stdout is the bare JSON and
          # nothing else. Without -A psql wraps long lines and the JSON comes back unparseable.
          psql -t -A -X -v ON_ERROR_STOP=1 -o raw-dump.json <<SQL
          select json_build_object(
            'packet',        (select row_to_json(p) from packet p where p.id = '$PKT'),
            'opp',           (select row_to_json(o) from opportunity o where o.id = '$OPP'),
            'artifacts',     (select coalesce(json_agg(row_to_json(a)), '[]'::json)
                              from artifact a where a.packet_id = '$PKT'),
            'insertions',    (select coalesce(json_agg(row_to_json(i)), '[]'::json)
                              from insertion i
                              where i.artifact_id in (select id from artifact where packet_id = '$PKT')),
            'corrections',   (select coalesce(json_agg(row_to_json(c)), '[]'::json)
                              from correction c
                              where c.artifact_id in (select id from artifact where packet_id = '$PKT')),
            'requirements',  (select coalesce(json_agg(row_to_json(r) order by r.seq), '[]'::json)
                              from requirement r where r.opp_id = '$OPP'),
            'gates',         (select coalesce(json_agg(row_to_json(g)), '[]'::json)
                              from artifact_gate g
                              where g.artifact_id in (select id from artifact where packet_id = '$PKT')),
            'checks',        (select coalesce(json_agg(row_to_json(cr)), '[]'::json)
                              from check_result cr
                              where cr.artifact_id in (select id from artifact where packet_id = '$PKT')),
            'swaps',         (select coalesce(json_agg(row_to_json(s) order by s.seq), '[]'::json)
                              from swap_decision s where s.packet_id = '$PKT'),
            -- THE OWNER'S CHECK THRESHOLDS. Without these the fixture renders every rule label
            -- ("<= 24 chars each", the word bands, the gate contract) as unset, which reads exactly
            -- like the product having lost its limits - and on 2026-08-29 was reported to the owner
            -- as precisely that catastrophe. The values were live all along (24 / 20).
            -- build-fixtures.mjs maps chk_snake_case -> camelCase and serves this as
            -- `/search-prefs`.checks, the shape AssetBlocks.jsx:1158 reads.
            'checkPrefs',    (select row_to_json(sp) from owner_search_prefs sp
                              where sp.owner_email = (select owner_email from opportunity
                                                      where id = '$OPP'))
          )::text
          SQL

      # CAPTURE THE API'S OWN /requirements BODY -- do not rebuild it here.
      #
      # WHY THIS STEP EXISTS. `comparison` (the whole "posting against your profile" surface: the fit
      # cards and the DIMENSION/asks-for/evidences/FIT table) is NOT a table read. `comparisonPayload`
      # (appDimensions.ts:254) returns `dimensions` from `comparison_dimension` PLUS `summary`, `set`
      # and `stale`, each DERIVED in TypeScript from the dimension catalogue and DIMENSION_VERSION.
      # Re-deriving those in the builder would be a second dimension brain in JS, and a re-derived
      # fixture MEASURES ITSELF: any drift renders as app gaps. Measured 2026-09-02 -- the absence of
      # this one key made ~19 of 27 "missing panels" on the jd step phantom for weeks
      # (docs/qc-evidence/PROTOTYPE-COVERAGE.md 16a).
      #
      # A GH runner can reach the Function App; the sandbox cannot. So the runner asks the real route
      # and stores the answer VERBATIM. Zero derivation, immune to catalogue/version drift.
      - name: Capture the API's /requirements body (comparison lives here)
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          OPP: ${{ github.event.inputs.opp }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, time, hmac, hashlib, base64, urllib.request, urllib.error, urllib.parse
          opp = os.environ['OPP']
          secret = os.environ['AZURE_CLIENT_SECRET']
          dump = json.load(open('raw-dump.json'))
          owner = (dump.get('opp') or {}).get('owner_email')
          if not owner:
              raise SystemExit('no owner_email on the dumped opportunity - cannot mint a token')

          # Same scheme as api-test.yml: the Function signs with SESSION_SIGNING_SECRET ||
          # MICROSOFT_CLIENT_SECRET (== AZURE_CLIENT_SECRET), so this verifies server-side.
          def b64url(b):
              if isinstance(b, str): b = b.encode()
              return base64.urlsafe_b64encode(b).decode().rstrip('=')
          now = int(time.time())
          head = b64url(json.dumps({'alg':'HS256','typ':'JWT'}, separators=(',',':')))
          load = b64url(json.dumps({'email':owner,'provider':'fixture-refresh','iat':now,'exp':now+3600}, separators=(',',':')))
          sig  = b64url(hmac.new(secret.encode(), f'{head}.{load}'.encode(), hashlib.sha256).digest())
          token = f'{head}.{load}.{sig}'

          url = ('https://job-platform-api.azurewebsites.net/api/app/opportunity/'
                 f'{opp}/requirements?owner={urllib.parse.quote(owner)}')
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
          try:
              with urllib.request.urlopen(req) as r:
                  status, body = r.status, json.loads(r.read())
          except urllib.error.HTTPError as e:
              raise SystemExit(f'AC-4: /requirements returned HTTP {e.code} - refusing to commit')

          # AC-4: a non-200 or an error-shaped body never reaches the branch.
          if status != 200 or not isinstance(body, dict) or 'error' in body:
              raise SystemExit(f'AC-4: HTTP {status} / error body - refusing to commit')
          cmp_ = body.get('comparison')
          if not isinstance(cmp_, dict):
              raise SystemExit('AC-4: the response carries no `comparison` key - refusing to commit')

          # AC-2: an UNRESOLVED comparison is the defect wearing a new hat. With dimensions:[] the
          # compare cards and the 4-column table do not render at all, and the fixture would pass a
          # naive canary while leaving the same ~19 panels missing.
          if cmp_.get('resolved') is not True or not (cmp_.get('dimensions') or []):
              raise SystemExit(
                  f'AC-2: opportunity {opp} has no comparison_dimension rows - resolve it, or pick '
                  'an opportunity that has been resolved; a fixture built from it cannot see the '
                  'compare surface.')

          # AC-5: never freeze a transient profile-read failure into the instrument. Baking one in
          # renders the evidence surface as broken PRODUCT - the same class as the 24/20 report.
          if 'profile UNREADABLE' in (body.get('profileSources') or []):
              raise SystemExit('AC-5: profileSources says UNREADABLE - the profile read failed; '
                               'capturing this would bake an outage into the fixture')

          dump['apiRequirements'] = body
          json.dump(dump, open('raw-dump.json','w'))
          d = cmp_.get('dimensions') or []
          graded = len([r for r in d if r.get('fit') not in (None, 'not_applicable')])
          print(f'captured /requirements: {len(body.get("requirements") or [])} requirements, '
                f'{len(d)} dimensions ({graded} graded), total={body.get("total")}')
          PYEOF

      - name: Report what came back
        run: |
          set -euo pipefail
          # A 200 with a zero count is a result to INVESTIGATE, not a pass - so print the
          # per-table counts and fail loudly on an empty dump rather than committing one.
          node -e "
            const d = JSON.parse(require('fs').readFileSync('raw-dump.json','utf8'));
            for (const k of ['artifacts','insertions','corrections','requirements','gates','checks','swaps'])
              console.log((d[k]||[]).length.toString().padStart(5), k);
            if (!d.packet) { console.error('no packet row - wrong id?'); process.exit(1) }
            const empty = ['artifacts','insertions','requirements'].filter(k => !(d[k]||[]).length);
            if (empty.length) { console.error('EMPTY: ' + empty.join(', ') + ' - refusing to commit a dump that would silently thin the fixtures'); process.exit(1) }
          "

      - name: Commit to the ui-fixtures branch
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Orphan branch: this data has nothing to do with the source history and must never
          # accumulate one - each refresh replaces the last.
          git checkout --orphan ui-fixtures
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name raw-dump.json -exec rm -rf {} +
          git add raw-dump.json
          git commit -m "fixture refresh ${{ github.event.inputs.opp }} @ ${{ github.sha }}"
          git push -f origin ui-fixtures
