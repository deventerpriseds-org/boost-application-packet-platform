name: Tests

# The repo had NO workflow that ran its own tests. Measured 2026-08-20:
# `grep -rln "npm test" .github/workflows/` returned nothing, while `api/` alone carried 262
# assertions — including the whole hardening suite, which exists specifically so that past mistakes
# cannot come back. They ran only where somebody ran them by hand, which means nothing stopped a
# regression reaching `main`.
#
# Deliberately NOT a deploy workflow: no Azure login, no secrets, no cloud access. It builds and
# tests, and that is all it can do.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: api — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # matches the Function App runtime
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # The tests import from `dist/`, so the build is a prerequisite, not a separate nicety.
      - run: npm run build
        working-directory: api
      - run: npm test
        working-directory: api

  app:
    name: app — build + unit + browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm test
        working-directory: app
      # Chromium is preinstalled on the runner image via Playwright's own download; the browser
      # probe boots its own Vite server. Non-fatal for now: it is newer than the unit suite and a
      # flake here should not block a correct change. Promote to required once it has a track record.
      - run: npm run test:browser
        working-directory: app
        continue-on-error: true

  # NO SMART-QUOTE JOB HERE, DELIBERATELY — one was written and removed the same night.
  #
  # It failed on its first run against 8 lines, and every one was correct code:
  #   Call.jsx:245-247,356  typographic quotes inside USER-FACING COPY, where curly is right
  #   Call.jsx:166,314,399  curly apostrophes in rendered prose ("the coach's actions")
  #   termMatch.ts:21       `t.replace(/[‘’‛]/g, "'")` — the smart-quote NORMALIZER, flagged for
  #                         containing the smart quotes it exists to strip
  # Both `npm run build` jobs passed with all 8 present, because none of them is in a syntax
  # position. That is the whole point: the failure CLAUDE.md describes is smart quotes where JSX
  # needs a straight quote, and `esbuild` already rejects exactly those — precisely, with a parser,
  # with no false positives, in a job that already runs above.
  #
  # A scanner cannot tell a syntax position from a string literal without parsing, so it either
  # misses real breakage or fires on correct code. This one fired on correct code, which by the
  # repo's own hardening rule #2 makes it worse than nothing: "a guard people learn to ignore is
  # worse than none." The build IS the guard. Duplicating it with a blunter instrument was an
  # extend-don't-duplicate violation as well as a cry-wolf one.
